# Synctappy FE: typecheck + build on every push/PR, auto-deploy main to the VPS.
# Secrets (repo or `production` environment): DEPLOY_HOST, DEPLOY_USER,
# DEPLOY_SSH_KEY (CI-only key, forced command on the VPS), DEPLOY_KNOWN_HOSTS.
# See DEPLOYMENT.md → "CI/CD".
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fe-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_SITE_URL: https://synctappy.biz.id

  deploy:
    name: Deploy to production
    needs: build
    # Off until the VPS key + secrets are set up: repo variable DEPLOY_ENABLED=true.
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://synctappy.biz.id
    concurrency:
      group: fe-deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH (forced-command key)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" fe

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://synctappy.biz.id/) && [ "$code" = 200 ] && { echo "https 200"; exit 0; }
            sleep 5
          done
          echo "smoke test failed (last code: $code)"; exit 1
